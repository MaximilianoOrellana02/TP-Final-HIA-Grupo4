name: soderia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Argentina/Jujuy
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Sin "ports": la base no se expone al host

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_URL_RESET: ${FRONTEND_URL}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MP_HABILITADO: "false"
      TZ: America/Argentina/Jujuy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - interna

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - interna
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    profiles: [backup]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        backup_tmp=$$(mktemp "/backups/soderia-$$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
        trap 'rm -f "$$backup_tmp"' EXIT
        pg_dump --format=custom --file="$$backup_tmp"
        mv "$$backup_tmp" "$$backup_tmp.dump"
        printf 'Backup guardado en %s\n' "$$backup_tmp.dump"
    volumes:
      - pg_backups:/backups
    networks:
      - interna
    depends_on:
      db:
        condition: service_healthy

networks:
  interna:

volumes:
  pg_data:
  pgadmin_data:
  pg_backups:
