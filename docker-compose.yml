name: soderia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Argentina/Jujuy
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Sin "ports": la base no se expone al host

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_URL_RESET: ${FRONTEND_URL}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MP_HABILITADO: "false"
      TZ: America/Argentina/Jujuy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - interna

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - interna
    depends_on:
      db:
        condition: service_healthy

  mantis-db:
    image: mariadb@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
    profiles: [incidencias]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MANTIS_DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: bugtracker
      MARIADB_USER: mantisbt
      MARIADB_PASSWORD: ${MANTIS_DB_PASSWORD:-}
    volumes:
      - mantis_db_data:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40

  mantisbt:
    image: xlrl/mantisbt@sha256:89bc1bc55fd18698dd6acee8742b503942614b2ac322fb91fd8a62f157fa94cd
    profiles: [incidencias]
    restart: unless-stopped
    environment:
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD:-}
      MANTIS_CRYPTO_SALT: ${MANTIS_CRYPTO_SALT:-}
      MANTIS_BASE_URL: http://localhost:${MANTIS_PORT:-8989}/
      MANTIS_ENABLE_ADMIN: ${MANTIS_ENABLE_ADMIN:-0}
      MANTIS_SMTP_HOST: ${MANTIS_SMTP_HOST:-mantis-correo}
      MANTIS_SMTP_PORT: ${MANTIS_SMTP_PORT:-1025}
      MANTIS_SMTP_CONNECTION_MODE: ${MANTIS_SMTP_CONNECTION_MODE:-}
      MANTIS_SMTP_USER: ${MANTIS_SMTP_USER:-}
      MANTIS_SMTP_PASSWORD: ${MANTIS_SMTP_PASSWORD:-}
      MANTIS_FROM_EMAIL: ${MANTIS_FROM_EMAIL:-mantis@example.invalid}
    ports:
      - "127.0.0.1:${MANTIS_PORT:-8989}:80"
    volumes:
      - ./mantis/config_inc.php:/var/www/html/config/config_inc.php:ro
    networks:
      - interna
    depends_on:
      mantis-db:
        condition: service_healthy
      mantis-correo:
        condition: service_started

  mantis-correo:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    profiles: [incidencias]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANTIS_MAIL_PORT:-8026}:8025"
    networks:
      - interna

  backup:
    image: postgres:17-alpine
    profiles: [backup]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        backup_tmp=$$(mktemp "/backups/soderia-$$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
        trap 'rm -f "$$backup_tmp"' EXIT
        pg_dump --format=custom --file="$$backup_tmp"
        mv "$$backup_tmp" "$$backup_tmp.dump"
        printf 'Backup guardado en %s\n' "$$backup_tmp.dump"
    volumes:
      - pg_backups:/backups
    networks:
      - interna
    depends_on:
      db:
        condition: service_healthy

networks:
  interna:

volumes:
  pg_data:
  pgadmin_data:
  pg_backups:
  mantis_db_data:
