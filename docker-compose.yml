name: soderia

# ---------------------------------------------------------------------------
# Infraestructura completa en un único archivo:
#   - Aplicación Sodería (backend + frontend + pgAdmin + backup)
#   - Clúster PostgreSQL HA (etcd + Patroni + HAProxy)
#   - Observabilidad (Prometheus + Grafana + exporters)
#
# Todos los servicios comparten la red bridge `red_cluster`. Ningún servicio
# interno publica puertos al host: la comunicación es por nombre de servicio.
# ---------------------------------------------------------------------------

services:
  # =========================================================================
  # APLICACIÓN
  # =========================================================================

  backend:
    image: ghcr.io/maximilianoorellana02/soderia-backend:latest
    build: ./backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PORT: 3001
      # La aplicación nunca habla con un nodo: siempre entra por HAProxy, que
      # enruta al primario de Patroni. El alias de red `db` mantiene compatibilidad.
      DB_HOST: haproxy
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-soderia}
      DB_USER: ${DB_USER:-soderia}
      DB_PASSWORD: ${DB_PASSWORD:-soderia_local}
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      FRONTEND_URL_RESET: ${FRONTEND_URL:-http://localhost:8080}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MP_HABILITADO: "false"
      TZ: America/Argentina/Jujuy
    depends_on:
      # HAProxy solo se reporta healthy cuando ve un primario de PostgreSQL.
      haproxy:
        condition: service_healthy
    networks:
      - red_cluster

  frontend:
    image: ghcr.io/maximilianoorellana02/soderia-frontend:latest
    build: ./frontend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      # Único punto de entrada web de la aplicación.
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - red_cluster

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # Persistencia dentro del proyecto.
      - ./datos/pgadmin:/var/lib/pgadmin
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - red_cluster

  mantis-db:
    image: mariadb@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
    profiles: [incidencias]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MANTIS_DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: bugtracker
      MARIADB_USER: mantisbt
      MARIADB_PASSWORD: ${MANTIS_DB_PASSWORD:-}
    volumes:
      - mantis_db_data:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40

  mantisbt:
    image: xlrl/mantisbt@sha256:89bc1bc55fd18698dd6acee8742b503942614b2ac322fb91fd8a62f157fa94cd
    profiles: [incidencias]
    restart: unless-stopped
    environment:
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD:-}
      MANTIS_CRYPTO_SALT: ${MANTIS_CRYPTO_SALT:-}
      MANTIS_BASE_URL: http://localhost:${MANTIS_PORT:-8989}/
      MANTIS_ENABLE_ADMIN: ${MANTIS_ENABLE_ADMIN:-0}
      MANTIS_SMTP_HOST: ${MANTIS_SMTP_HOST:-mantis-correo}
      MANTIS_SMTP_PORT: ${MANTIS_SMTP_PORT:-1025}
      MANTIS_SMTP_CONNECTION_MODE: ${MANTIS_SMTP_CONNECTION_MODE:-}
      MANTIS_SMTP_USER: ${MANTIS_SMTP_USER:-}
      MANTIS_SMTP_PASSWORD: ${MANTIS_SMTP_PASSWORD:-}
      MANTIS_FROM_EMAIL: ${MANTIS_FROM_EMAIL:-mantis@example.invalid}
    ports:
      - "127.0.0.1:${MANTIS_PORT:-8989}:80"
    volumes:
      - ./mantis/config_inc.php:/var/www/html/config/config_inc.php:ro
    networks:
      - interna
    depends_on:
      mantis-db:
        condition: service_healthy
      mantis-correo:
        condition: service_started

  mantis-correo:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    profiles: [incidencias]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANTIS_MAIL_PORT:-8026}:8025"
    networks:
      - interna

  backup:
    image: postgres:17-alpine
    profiles: [backup]
    environment:
      PGHOST: haproxy
      PGDATABASE: ${DB_NAME:-soderia}
      PGUSER: ${DB_USER:-soderia}
      PGPASSWORD: ${DB_PASSWORD:-soderia_local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        backup_tmp=$$(mktemp "/backups/soderia-$$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
        trap 'rm -f "$$backup_tmp"' EXIT
        pg_dump --format=custom --file="$$backup_tmp"
        mv "$$backup_tmp" "$$backup_tmp.dump"
        printf 'Backup guardado en %s\n' "$$backup_tmp.dump"
    volumes:
      # Persistencia dentro del proyecto.
      - ./datos/backups:/backups
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - red_cluster

  # =========================================================================
  # CLÚSTER POSTGRESQL HA (Patroni + etcd + HAProxy)
  # =========================================================================

  # 1. Almacén de votos (DCS). Solo accesible internamente por Patroni.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd_cerebro
    restart: unless-stopped
    environment:
      - ETCD_NAME=etcd
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_DATA_DIR=/etcd-data
    volumes:
      - ./cluster/datos_db/etcd_data:/etcd-data
    networks:
      - red_cluster
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 2. Nodos PostgreSQL 17 + Patroni. Sin puertos publicados: 5432 y 8008 solo
  #    son accesibles dentro de `red_cluster` (HAProxy y Prometheus).
  nodo1:
    build: ./cluster/scripts
    container_name: postgres_nodo1
    restart: unless-stopped
    environment:
      - PATRONI_NAME=nodo1
      - PATRONI_RESTAPI_CONNECT_ADDRESS=nodo1:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=nodo1:5432
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME=postgres
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD=root
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME=replicator
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD=rep_pass
      - PATRONI_SUPERUSER_USERNAME=postgres
      - PATRONI_SUPERUSER_PASSWORD=root
      - PATRONI_REPLICATION_USERNAME=replicator
      - PATRONI_REPLICATION_PASSWORD=rep_pass
      - PATRONI_ETCD3_HOSTS=etcd:2379
      - PATRONI_SCOPE=cluster_bancario
      - PATRONI_POSTGRESQL_DATA_DIR=/var/lib/postgresql/data
      - PATRONI_POSTGRESQL_BIN_DIR=/usr/lib/postgresql/17/bin
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      # Credenciales que crea post_bootstrap.sh en el bootstrap.
      - SODERIA_DB_NAME=${DB_NAME:-soderia}
      - SODERIA_DB_USER=${DB_USER:-soderia}
      - SODERIA_DB_PASSWORD=${DB_PASSWORD:-soderia_local}
    volumes:
      - ./cluster/datos_db/nodo1_data:/var/lib/postgresql/data
    networks:
      - red_cluster
    depends_on:
      etcd:
        condition: service_healthy

  nodo2:
    build: ./cluster/scripts
    container_name: postgres_nodo2
    restart: unless-stopped
    environment:
      - PATRONI_NAME=nodo2
      - PATRONI_RESTAPI_CONNECT_ADDRESS=nodo2:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=nodo2:5432
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME=postgres
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD=root
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME=replicator
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD=rep_pass
      - PATRONI_SUPERUSER_USERNAME=postgres
      - PATRONI_SUPERUSER_PASSWORD=root
      - PATRONI_REPLICATION_USERNAME=replicator
      - PATRONI_REPLICATION_PASSWORD=rep_pass
      - PATRONI_ETCD3_HOSTS=etcd:2379
      - PATRONI_SCOPE=cluster_bancario
      - PATRONI_POSTGRESQL_DATA_DIR=/var/lib/postgresql/data
      - PATRONI_POSTGRESQL_BIN_DIR=/usr/lib/postgresql/17/bin
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - SODERIA_DB_NAME=${DB_NAME:-soderia}
      - SODERIA_DB_USER=${DB_USER:-soderia}
      - SODERIA_DB_PASSWORD=${DB_PASSWORD:-soderia_local}
    volumes:
      - ./cluster/datos_db/nodo2_data:/var/lib/postgresql/data
    networks:
      - red_cluster
    depends_on:
      etcd:
        condition: service_healthy

  nodo3:
    build: ./cluster/scripts
    container_name: postgres_nodo3
    restart: unless-stopped
    environment:
      - PATRONI_NAME=nodo3
      - PATRONI_RESTAPI_CONNECT_ADDRESS=nodo3:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=nodo3:5432
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME=postgres
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD=root
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME=replicator
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD=rep_pass
      - PATRONI_SUPERUSER_USERNAME=postgres
      - PATRONI_SUPERUSER_PASSWORD=root
      - PATRONI_REPLICATION_USERNAME=replicator
      - PATRONI_REPLICATION_PASSWORD=rep_pass
      - PATRONI_ETCD3_HOSTS=etcd:2379
      - PATRONI_SCOPE=cluster_bancario
      - PATRONI_POSTGRESQL_DATA_DIR=/var/lib/postgresql/data
      - PATRONI_POSTGRESQL_BIN_DIR=/usr/lib/postgresql/17/bin
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - SODERIA_DB_NAME=${DB_NAME:-soderia}
      - SODERIA_DB_USER=${DB_USER:-soderia}
      - SODERIA_DB_PASSWORD=${DB_PASSWORD:-soderia_local}
    volumes:
      - ./cluster/datos_db/nodo3_data:/var/lib/postgresql/data
    networks:
      - red_cluster
    depends_on:
      etcd:
        condition: service_healthy

  # 3. Enrutador / punto de entrada SQL. Solo publica el panel de estadísticas;
  #    el puerto 5432 queda comentado a propósito (no se expone la BD al host).
  haproxy:
    image: haproxy:alpine
    container_name: haproxy_router
    restart: unless-stopped
    ports:
      # - "5432:5432"   # PostgreSQL: solo red interna (backend/pgadmin/backup)
      - "7000:7000"     # Panel de estadísticas para demostrar el failover
    volumes:
      - ./cluster/config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      red_cluster:
        aliases:
          - db          # compatibilidad: backend puede usar DB_HOST=db
    depends_on:
      - nodo1
      - nodo2
      - nodo3
    healthcheck:
      # Solo healthy cuando HAProxy ve al menos un primario (backend status UP).
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:7000/;csv' | grep -q 'postgres_back,BACKEND.*UP'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # =========================================================================
  # OBSERVABILIDAD
  # =========================================================================

  # Exportador de métricas de PostgreSQL. Sin puertos: solo lo consulta Prometheus.
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-soderia}:${DB_PASSWORD:-soderia_local}@haproxy:5432/${DB_NAME:-soderia}?sslmode=disable
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - red_cluster

  # Métricas de contenedores/host. Sin puertos: solo lo consulta Prometheus.
  cadvisor_monitor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor_monitor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - red_cluster

  # Prometheus: sin puertos hacia el host; Grafana lo consume por nombre.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    restart: unless-stopped
    volumes:
      - ./cluster/observabilidad/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Persistencia de la serie temporal dentro del proyecto.
      - ./cluster/observabilidad/prometheus_data:/prometheus
    networks:
      - red_cluster

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./cluster/observabilidad/grafana_data:/var/lib/grafana
      # Provisioning: datasource + dashboards se cargan al iniciar.
      - ./cluster/observabilidad/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./cluster/observabilidad/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./cluster/observabilidad/dashboards_json:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - red_cluster

  # =========================================================================
  # DESPLIEGUE CONTINUO
  # =========================================================================

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup --label-enable

# ---------------------------------------------------------------------------
# Redes del stack. Los servicios del clúster se resuelven por nombre en red_cluster.
# ---------------------------------------------------------------------------
networks:
  red_cluster:
    name: red_cluster
    driver: bridge
  interna:

volumes:
  mantis_db_data:
