apiVersion: 1

# Elimina cualquier datasource viejo de Loki si todavía existe en grafana.db.
deleteDatasources:
  - name: loki
    orgId: 1

datasources:
  - name: prometheus
    uid: ffyx82a3iptkwb
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
