global:
  resolve_timeout: 5m

route:
  receiver: 'n8n-mantis-webhook'
  group_by: ['alertname', 'job', 'instance']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 24h

receivers:
  - name: 'n8n-mantis-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/soderia-alertas-infraestructura'
        send_resolved: false
        http_config:
          basic_auth:
            username: 'alertmanager'
            password_file: '/etc/alertmanager/secrets/n8n_webhook_password'