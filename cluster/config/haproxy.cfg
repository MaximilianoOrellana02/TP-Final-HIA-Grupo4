global
    log stdout format raw local0
    maxconn 1000

defaults
    log     global
    mode    tcp
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout check   5000ms

# 1. Resolver DNS interno de Docker (127.0.0.11)
resolvers docker_dns
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s

# 2. Frontend de Escritura (PostgreSQL Primario)
frontend postgres_front
    bind *:5432
    mode tcp
    option tcplog
    default_backend postgres_back

# 3. Backend con tolerancia a contenedores caidos
backend postgres_back
    mode tcp
    option httpchk
    # Patroni expone /primary (200 en el lider, 503 en las replicas).
    http-check connect port 8008
    http-check send meth GET uri /primary
    http-check expect status 200

    # init-addr last,libc,none evita que HAProxy crashee si un nodo no responde por DNS
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker_dns init-addr last,libc,none

    server nodo1 nodo1:5432 maxconn 200 check port 8008
    server nodo2 nodo2:5432 maxconn 200 check port 8008
    server nodo3 nodo3:5432 maxconn 200 check port 8008

# 4. Panel de estadisticas en vivo (http://localhost:7000/)
#    El CSV interno (http://localhost:7000/;csv) lo usa el healthcheck de Docker.
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats show-node
